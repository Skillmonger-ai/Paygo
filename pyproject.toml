[project]
name = "paygo"
version = "0.0.1"
description = "Give software an allowance: a hard dollar budget around an autonomous process."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# The kernel + CLI use Typer; the ledger uses the stdlib sqlite3 module. The
# Milestone-2 process wrapper adds the localhost service (FastAPI + uvicorn) and
# an HTTP client (httpx, also used by example agents). x402/inference deps are
# added when those milestones land (IMPLEMENTATION_PLAN.md).
dependencies = [
    "typer>=0.15,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
# Live Coinbase/CDP wallet + x402 signing. Demo setup does not need this.
# x402 2.x is the current PyPI line (x402Client / ExactEvmScheme); 0.x/1.x
# do not expose that API. No extras — 2.x ships the EVM scheme in the base package.
coinbase = [
    "cdp-sdk>=1.32,<2.0",
    "x402>=2.0,<3.0",
]

[project.scripts]
paygo = "paygo.cli:main"

[dependency-groups]
# Dev tooling installed by `uv sync` (uv installs dependency groups by default).
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paygo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
